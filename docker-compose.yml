services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: open-agentic-ops-postgres
    environment:
      POSTGRES_USER: openops
      POSTGRES_PASSWORD: openops
      POSTGRES_DB: openops
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openops -d openops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
